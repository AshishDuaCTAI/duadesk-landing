<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Vista EPC Platform – demo</title>
<style>
:root{--ink:#14202D;--muted:#5B6878;--line:#D9DFE6;--accent:#E0591B;--bg:#F5F7F9;--card:#fff;--bad:#B42318}
@media (prefers-color-scheme:dark){:root{--ink:#E9EEF3;--muted:#9AA8B6;--line:#2C3B4B;--bg:#0F1720;--card:#16212D;--bad:#F97066}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 26px;box-shadow:0 10px 30px rgba(10,20,30,.08)}
.k{color:var(--accent);font:700 12px/1 Inter,Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:24px;line-height:1.2;margin:10px 0 6px}p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
input{width:100%;font:600 18px/1 ui-monospace,Consolas,monospace;letter-spacing:.08em;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-transform:uppercase}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ink);color:var(--card);font:600 15px Inter,Arial,sans-serif;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.foot{margin-top:18px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <div class="k">Vista EPC Platform · demo</div>
  <h1>Enter your access code</h1>
  <p>This demo is for the Vista team. It uses invented sample data. Ashish has shared the access code with you.</p>
  <form id="f" autocomplete="off">
    <label for="c">Access code</label>
    <input id="c" name="c" inputmode="text" autocapitalize="characters" spellcheck="false" required>
    <button id="b" type="submit">Open the demo</button>
    <div class="err" id="e" role="alert" aria-live="polite"></div>
  </form>
  <div class="foot">Works in Chrome or Edge on a computer or phone. No sign-in needed.</div>
</main>
<script>
const META = {"v": 1, "salt": "2TWDlBUn4vFZV/nt1tlYtw==", "iter": 310000};
const SK = 'vista-epc-demo-key';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const base = () => { let p = location.pathname.replace(/index\.html$/, ''); if (!p.endsWith('/')) p += '/'; return p };
let blob = null;
async function load() { if (blob) return blob; const r = await fetch(base() + 'app.enc', { cache: 'no-cache' }); if (!r.ok) throw new Error('fetch'); blob = new Uint8Array(await r.arrayBuffer()); return blob }
async function keyFrom(code) {
  const norm = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(META.salt), iterations: META.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open(key) {
  const buf = await load();
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
async function tryStored() {
  let raw = null; try { raw = sessionStorage.getItem(SK) } catch (e) { }
  if (!raw) return false;
  try { const k = await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', false, ['decrypt']); await open(k); return true } catch (e) { try { sessionStorage.removeItem(SK) } catch (x) { } return false }
}
const f = document.getElementById('f'), c = document.getElementById('c'), b = document.getElementById('b'), e = document.getElementById('e');
if (!window.crypto || !crypto.subtle) { e.textContent = 'Please open this page in an up-to-date Chrome or Edge.'; b.disabled = true }
f.addEventListener('submit', async ev => {
  ev.preventDefault(); e.textContent = ''; b.disabled = true; b.textContent = 'Opening…';
  try {
    const k = await keyFrom(c.value);
    try { await load() } catch (x) { e.textContent = 'The demo could not be loaded. Check your internet connection and try again.'; return }
    try { const raw = await crypto.subtle.exportKey('raw', k); await open(k); try { sessionStorage.setItem(SK, toB64(raw)) } catch (x) { } }
    catch (x) { e.textContent = 'That code is not right. Please check it and try again.'; c.select() }
  } finally { b.disabled = false; b.textContent = 'Open the demo' }
});
tryStored().then(ok => { if (!ok) c.focus() });
</script>
</body>
</html>
